[package]
name = "cast"
version = "0.12.0"
edition = "2024"
rust-version = "1.88"
description = "Cast local video and a desktop to Google Cast devices"
license = "MIT"
homepage = "https://github.com/michaelishri/cast-rs"
repository = "https://github.com/michaelishri/cast-rs"

[dependencies]
aes = "0.8"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
ctrlc = "3.5"
ctr = "0.9"
env_logger = "0.11"
ffmpeg-next = { version = "=8.1.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
getrandom = "0.4"
log = "0.4"
mdns-sd = "0.20"
muxide = "0.2.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rust_cast = { git = "https://github.com/michaelishri/rust-cast.git", rev = "d877d0f9dabbca094d1b5ea5efc68a91c5ae75b0" }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", features = ["screencast"] }
bzip2 = "0.6"
enumflags2 = "0.7"
futures-lite = "2.6"
libloading = "0.8"
libc = "0.2"
pipewire = { version = "0.9.2", default-features = false, features = ["v0_3_44"] }
sha2 = "0.10"
tokio = { version = "1.47", features = ["rt-multi-thread"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
x11rb = { version = "0.14", default-features = false, features = ["image", "randr", "shm", "xfixes"] }

[patch.crates-io]
# pipewire-rs 0.9.2 exposes post-0.3.65 video fields without guarding them,
# which prevents builds against the Ubuntu 22.04 PipeWire headers.
libspa = { path = "vendor/libspa" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
screencapturekit = { version = "8.0", features = ["macos_13_0"] }
videotoolbox = { version = "0.18", features = ["compression"] }

[dev-dependencies]

[build-dependencies]
cc = "1.4"
