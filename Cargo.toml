[package]
name = "cast"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Cast local video and a macOS desktop to Google Cast devices"
license = "MIT"
homepage = "https://github.com/michaelishri/cast-rs"
repository = "https://github.com/michaelishri/cast-rs"

[dependencies]
aes = "0.8"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
ctr = "0.9"
env_logger = "0.11"
getrandom = "0.4"
log = "0.4"
mdns-sd = "0.20"
muxide = "0.2.5"
rust_cast = { path = "vendor/rust-cast" }
screencapturekit = { version = "8.0", features = ["macos_13_0"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
videotoolbox = { version = "0.18", features = ["compression"] }

[dev-dependencies]
tempfile = "3.20"
