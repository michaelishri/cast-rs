[package]
name = "cast"
version = "0.9.1"
edition = "2024"
rust-version = "1.88"
description = "Cast local video and a desktop to Google Cast devices"
license = "MIT"
homepage = "https://github.com/michaelishri/cast-rs"
repository = "https://github.com/michaelishri/cast-rs"

[dependencies]
aes = "0.8"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
ctrlc = "3.5"
ctr = "0.9"
env_logger = "0.11"
ffmpeg-next = { version = "=8.1.0", default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
getrandom = "0.4"
log = "0.4"
mdns-sd = "0.20"
muxide = "0.2.5"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rust_cast = { git = "https://github.com/michaelishri/rust-cast.git", rev = "d877d0f9dabbca094d1b5ea5efc68a91c5ae75b0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8.0", features = ["macos_13_0"] }
videotoolbox = { version = "0.18", features = ["compression"] }

[dev-dependencies]

[build-dependencies]
cc = "1.4"
