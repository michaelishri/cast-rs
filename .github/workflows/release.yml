name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches Cargo package version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Use stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache linked media libraries
        uses: actions/cache@v5
        with:
          path: .build
          key: ffmpeg-8.0.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg-libraries.sh') }}

      - name: Build linked media libraries
        shell: bash
        run: |
          brew install nasm pkg-config
          ./scripts/build-ffmpeg-libraries.sh "$PWD/.build/ffmpeg-dist"
          echo "PKG_CONFIG_PATH=$PWD/.build/ffmpeg-dist/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$PWD/.build/ffmpeg-dist/lib" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release archive and checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive_root="cast-${version}-macos-${{ matrix.arch }}"
          mkdir -p "package/$archive_root" dist
          cp target/release/cast "package/$archive_root/"
          mkdir -p "package/$archive_root/lib"
          cp -R .build/ffmpeg-dist/lib/*.dylib "package/$archive_root/lib/"
          cp README.md "package/$archive_root/"
          cp LICENSE "package/$archive_root/"
          cp THIRD_PARTY_NOTICES.md "package/$archive_root/"
          cp .build/ffmpeg-8.0.1/COPYING.LGPLv2.1 "package/$archive_root/FFMPEG-LICENSE-LGPL-2.1.txt"
          tar -C package -czf "dist/${archive_root}.tar.gz" "$archive_root"
          (
            cd dist
            shasum -a 256 "${archive_root}.tar.gz" > "${archive_root}.tar.gz.sha256"
          )

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  linux:
    name: Build Linux ${{ matrix.archive_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - archive_arch: x86_64
            runner: ubuntu-22.04
          - archive_arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches Cargo package version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Use stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install build and audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libpipewire-0.3-dev libva-dev nasm patchelf pkg-config

      - name: Cache linked media libraries
        uses: actions/cache@v5
        with:
          path: .build
          key: ffmpeg-8.0.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-ffmpeg-libraries.sh') }}

      - name: Build linked media libraries
        shell: bash
        run: |
          ./scripts/build-ffmpeg-libraries.sh "$PWD/.build/ffmpeg-dist"
          echo "PKG_CONFIG_PATH=$PWD/.build/ffmpeg-dist/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/.build/ffmpeg-dist/lib" >> "$GITHUB_ENV"

      - name: Validate and build release binary
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked
          cargo build --locked --release

      - name: Package release archive, checksum, and dependency audit
        shell: bash
        run: |
          archive="cast-linux-${{ matrix.archive_arch }}"
          archive_root="$archive"
          mkdir -p "package/$archive_root/lib" dist
          cp target/release/cast "package/$archive_root/"
          cp -a .build/ffmpeg-dist/lib/libavcodec.so* "package/$archive_root/lib/"
          cp -a .build/ffmpeg-dist/lib/libavformat.so* "package/$archive_root/lib/"
          cp -a .build/ffmpeg-dist/lib/libavutil.so* "package/$archive_root/lib/"
          cp -a .build/ffmpeg-dist/lib/libswresample.so* "package/$archive_root/lib/"
          cp -a .build/ffmpeg-dist/lib/libswscale.so* "package/$archive_root/lib/"
          cp -a .build/ffmpeg-dist/lib/libcast_openh264_loader.so* "package/$archive_root/lib/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "package/$archive_root/"
          cp .build/ffmpeg-8.0.1/COPYING.LGPLv2.1 "package/$archive_root/FFMPEG-LICENSE-LGPL-2.1.txt"
          patchelf --set-rpath '$ORIGIN/lib' "package/$archive_root/cast"
          find "package/$archive_root/lib" -type f -name '*.so*' -print0 | while IFS= read -r -d '' library; do
            patchelf --set-rpath '$ORIGIN' "$library"
          done
          readelf -d "package/$archive_root/cast" | grep -F '[$ORIGIN/lib]'
          LD_LIBRARY_PATH= ldd "package/$archive_root/cast" | tee "dist/$archive.ldd.txt"
          ! grep -F 'not found' "dist/$archive.ldd.txt"
          grep -F "package/$archive_root/lib/libavcodec.so" "dist/$archive.ldd.txt"
          tar -C package -czf "dist/$archive.tar.gz" "$archive_root"
          (
            cd dist
            sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256"
          )

      - name: Smoke-test packaged archive
        shell: bash
        run: |
          smoke_root="$(mktemp -d)"
          tar -xzf "dist/cast-linux-${{ matrix.archive_arch }}.tar.gz" -C "$smoke_root"
          env -u LD_LIBRARY_PATH "$smoke_root/cast-linux-${{ matrix.archive_arch }}/cast" --version
          env -u LD_LIBRARY_PATH "$smoke_root/cast-linux-${{ matrix.archive_arch }}/cast" --help >/dev/null

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.archive_arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [build, linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
